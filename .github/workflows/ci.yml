name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # build 脚本已含 tsc --noEmit，这里再单列一次是为了让报错直接指向类型问题
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
