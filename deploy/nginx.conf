# 专业适配站点的 Nginx 配置
# 放到 /etc/nginx/conf.d/majorfit.conf 后 nginx -t && systemctl reload nginx

# 上报接口按 IP 限速：公开写接口不设限，日志迟早被灌满
limit_req_zone $binary_remote_addr zone=majorfit_events:10m rate=20r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name your-domain.com;

    # 证书路径按你的实际签发方式填（Certbot / 腾讯云免费证书）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    root /var/www/majorfit;
    index index.html;

    # 上报：只允许小请求体，严格限速
    location = /api/events {
        limit_req zone=majorfit_events burst=10 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # 统计查询：口令之外再加一层 IP 白名单，双保险
    location = /api/stats {
        allow 127.0.0.1;
        # allow 你家/公司的固定出口 IP;
        deny all;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }

    # 带哈希的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口文件不能缓存，否则发版后用户拿到旧版本
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
