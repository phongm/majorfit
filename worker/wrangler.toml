name = "majorfit-stats"
main = "index.ts"
compatibility_date = "2025-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "majorfit-events"
# database_id 在创建 D1 后填入，格式如：xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
# database_id = ""

# 环境变量（非敏感）
[vars]
# 不需要额外的 vars，STATS_TOKEN 用 wrangler secret put 设置

# 部署配置
[env.production]
# 生产环境可以覆盖配置
